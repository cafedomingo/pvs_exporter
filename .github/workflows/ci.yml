name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -coverpkg=./internal/... -coverprofile=coverage.out ./...

      - name: Coverage
        run: go tool cover -func=coverage.out

  # One job rather than a matrix, so branch protection can require "build".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build linux amd64, arm64, arm and riscv64
        env:
          GOOS: linux
          CGO_ENABLED: "0"
        run: for arch in amd64 arm64 arm riscv64; do GOARCH=$arch go build ./...; done
